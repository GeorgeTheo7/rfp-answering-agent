services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - ./Backend/data:/app/data:ro
      - ./Backend/chroma_db:/app/chroma_db

  frontend:
    build: ./Frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
